name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      VERSION_NAME: "1.0"
      VERSION_TAG: "v1.0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Android components and write sdk.dir
        run: |
          set -e
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Setup Gradle Wrapper (Gradle 8.5)
        run: |
          set -e
          mkdir -p gradle/wrapper
          curl -fsSLo gradle/wrapper/gradle-wrapper.jar \
            "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"
          curl -fsSLo gradlew \
            "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew"
          chmod +x gradlew
          printf 'distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip\nnetworkTimeout=60000\nvalidateDistributionUrl=true\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n' > gradle/wrapper/gradle-wrapper.properties
          ls -la gradlew gradle/wrapper/

      - name: Assemble Debug APK
        run: ./gradlew --no-daemon clean assembleDebug

      - name: Rename APK
        run: |
          set -e
          ls -la app/build/outputs/apk/debug/
          APK_SRC="$(ls app/build/outputs/apk/debug/*.apk | head -1)"
          cp "$APK_SRC" "app/build/outputs/apk/debug/RE-${VERSION_NAME}-debug.apk"
          ls -la "app/build/outputs/apk/debug/RE-${VERSION_NAME}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RE-debug-apk
          path: app/build/outputs/apk/debug/RE-${{ env.VERSION_NAME }}-debug.apk
          if-no-files-found: error

      - name: Delete existing tag/release v1.0
        continue-on-error: true
        run: |
          git push origin :refs/tags/${VERSION_TAG} 2>/dev/null || true
          gh release delete ${VERSION_TAG} -y 2>/dev/null || true

      - name: Create GitHub Release v1.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "RE v${{ env.VERSION_NAME }}"
          generate_release_notes: true
          prerelease: false
          make_latest: true
          files: |
            app/build/outputs/apk/debug/RE-${{ env.VERSION_NAME }}-debug.apk
