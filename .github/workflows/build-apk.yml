name: Build BadukNext APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-34
            build-tools;34.0.0

      - name: Sync binaries from badukai
        run: |
          chmod +x ./setup-from-badukai.sh
          ./setup-from-badukai.sh
          echo "=== Assets before cleanup ==="
          du -sh app/src/main/assets/*/ 2>/dev/null || echo "no subdirs"
          du -sh app/src/main/jniLibs/ 2>/dev/null || echo "no jniLibs"
          # Remove old model files — we download 6b at runtime
          rm -rvf app/src/main/assets/models
          echo "=== Assets after cleanup ==="
          du -sh app/src/main/assets/*/ 2>/dev/null || echo "no subdirs"

          # =========================================================
          # APK SHRINK P0 + HOTFIX SAFE (belt & suspenders) — CI re-runs
          # the same pruning as setup-from-badukai.sh so any future
          # accidental revert of the shell script cannot re-inflate.
          # IMPORTANT: assets/libkatago.so is NOW PRESERVED (we need it
          # for fall-back engine start path if direct exec of jniLibs
          # is blocked by SELinux / noexec mount on user devices).
          # =========================================================
          DST=app/src/main
          prune() { rm -fv "$@" || true; }

          # 1) KataGo exclusive variants (KataGoEngine hardcodes libkatago.so only)
          prune $DST/jniLibs/arm64-v8a/libkatago_without_snpe.so
          prune $DST/jniLibs/arm64-v8a/libkatago_large_boards_without_snpe.so

          # 2) OpenCV + photo board-recognition (no CAMERA permission → impossible to use)
          prune $DST/jniLibs/arm64-v8a/libopencv_core.so
          prune $DST/jniLibs/arm64-v8a/libopencv_imgproc.so
          prune $DST/jniLibs/arm64-v8a/libopencv_imgcodecs.so
          prune $DST/jniLibs/arm64-v8a/libopencv_features2d.so
          prune $DST/jniLibs/arm64-v8a/libopencv_flann.so
          prune $DST/jniLibs/arm64-v8a/libimgToSgf.so
          prune $DST/jniLibs/arm64-v8a/libhidapi.so

          # 3) SDL (UI = Compose Canvas ; audio = SoundPool)
          prune $DST/jniLibs/arm64-v8a/libSDL2.so
          prune $DST/jniLibs/arm64-v8a/libSDL2_image.so
          prune $DST/jniLibs/arm64-v8a/libSDL2_mixer.so
          prune $DST/jniLibs/arm64-v8a/libSDL2_ttf.so

          # 4) Python runtime (upstream already removed .py scripts)
          prune $DST/jniLibs/arm64-v8a/libpython3.7m.so

          # DO NOT prune assets/libkatago.so any more — kept as engine start fallback

          echo "=== Post-prune .so TOP 20 by size ==="
          find app/src/main -name "*.so" -exec ls -lh {} \; 2>/dev/null | awk '{print $5, $NF}' | sort -rh | head -20
          echo "=== assets/libkatago.so present? ==="
          ls -la app/src/main/assets/libkatago.so 2>/dev/null || echo "MISSING (engine fallback copy not available!)"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: |
          echo "=== APK content estimate ==="
          find app/src/main -name "*.so" -exec ls -lh {} \; 2>/dev/null | awk '{print $5, $NF}' | sort -rh | head -20
          find app/src/main -name "*.bin*" -exec ls -lh {} \; 2>/dev/null | awk '{print $5, $NF}'
          echo "=== Building ==="
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BadukNext-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
          retention-days: 7
