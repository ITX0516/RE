name: Build BadukNext APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: >
            platforms;android-34
            build-tools;34.0.0

      - name: Sync binaries from badukai
        run: |
          chmod +x ./setup-from-badukai.sh
          ./setup-from-badukai.sh
          echo "=== Assets before cleanup ==="
          du -sh app/src/main/assets/*/ 2>/dev/null || echo "no subdirs"
          du -sh app/src/main/jniLibs/ 2>/dev/null || echo "no jniLibs"
          # Remove old model files — we download 6b at runtime
          rm -rvf app/src/main/assets/models
          echo "=== Assets after cleanup ==="
          du -sh app/src/main/assets/*/ 2>/dev/null || echo "no subdirs"
          echo "=== jniLibs before cleanup ==="
          find app/src/main/jniLibs -name "*.so" -exec ls -lh {} \; 2>/dev/null | awk '{print $5, $NF}' | sort -rh
          # Remove everything except libc++_shared (CPU-only doesn't need QNN/SNPE/Hexagon)
          find app/src/main/jniLibs -name "*.so" ! -name "libc++_shared.so" -delete 2>/dev/null
          echo "=== jniLibs after cleanup ==="
          du -sh app/src/main/jniLibs/ 2>/dev/null || echo "empty"
          # Strip debug symbols from remaining .so
          find app/src/main -name "*.so" -exec sh -c 'ls -lh "$1" && llvm-objcopy --strip-all "$1" "$1.strip" 2>/dev/null && mv "$1.strip" "$1" && echo "stripped: $1"' _ {} \; 2>/dev/null || echo "strip not available"
          echo "=== Final .so sizes ==="
          find app/src/main -name "*.so" -exec ls -lh {} \; 2>/dev/null | awk '{print $5, $NF}'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.5

      - name: Build Debug APK
        run: |
          echo "=== APK content estimate ==="
          find app/src/main -name "*.so" -exec ls -lh {} \; 2>/dev/null | awk '{print $5, $NF}' | sort -rh | head -20
          find app/src/main -name "*.bin*" -exec ls -lh {} \; 2>/dev/null | awk '{print $5, $NF}'
          echo "=== Building ==="
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BadukNext-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/
          retention-days: 7
